name: 2. Seguridad SAST (CodeQL)

on:
  push:
    branches:
      - main
      - desarrollo
      - "desarrollo_*"
  pull_request:
    branches:
      - main
  schedule:
    # Ejecucion semanal todos los lunes a las 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Principio de menor privilegio: sin permisos globales por defecto
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analisis Estatico CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - name: Endurecer entorno de ejecucion (Harden-Runner)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Descargar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: +security-extended

      - name: Ejecutar analisis CodeQL
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"
