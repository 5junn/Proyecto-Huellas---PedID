name: 1. Calidad y Build (CI)

on:
  push:
    branches:
      - main
      - desarrollo
      - "desarrollo_*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Principio de menor privilegio: sin permisos por defecto a nivel global
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend (Lint y Build Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Endurecer entorno de ejecucion (Harden-Runner)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Descargar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Instalar dependencias del Frontend
        run: npm ci

      - name: Analizar codigo con Oxlint (informativo)
        continue-on-error: true
        run: npm run lint

      - name: Compilar proyecto Vite
        run: npm run build
        env:
          VITE_API_URL: http://localhost:4000

  backend-ci:
    name: Backend (Sintaxis y Pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Endurecer entorno de ejecucion (Harden-Runner)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Descargar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./backend/package-lock.json"

      - name: Instalar dependencias del Backend
        run: npm ci

      - name: Verificar sintaxis de archivos JS
        run: find . -maxdepth 4 -name "*.js" -not -path "./node_modules/*" -exec node --check {} +

      - name: Ejecutar pruebas si existen
        run: npm test --if-present
